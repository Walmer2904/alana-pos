<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALANA POS · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Kaushan+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" type="image/png" sizes="32x32" href="img/iconos/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/iconos/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#141414">
</head>
<body>
  <main class="login">
    <!-- Panel de marca con fondo de pizarra (como el local) -->
    <section class="login-marca pizarra" aria-label="Marca">
      <img class="login-logo" src="img/logo.png" alt="Logo de Alana: dinosaurio con moño rosado, hamburguesas y papas">
      <h1 class="marca">Alana</h1>
      <p class="lema">Comida rápida · Punto de venta</p>
      <span class="telefono">930 822 405</span>
    </section>

    <section class="login-form-zona">
      <form class="login-form" id="formLogin" novalidate>
        <h2>Iniciar sesión</h2>
        <p class="texto-gris">Ingresa con el correo y contraseña que te dio el administrador.</p>

        <div id="errorLogin" class="mensaje-error oculto" role="alert"></div>

        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" autocomplete="username" required autofocus>
        </div>
        <div class="campo">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primario btn-grande" id="btnIngresar">Ingresar</button>
      </form>
    </section>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
